<title>星マート ─ 雨夜の街角</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #06080d;
  }
  body {
    background:
      radial-gradient(90% 72% at 50% 30%, #1c2536 0%, #131a27 38%, #0a0d15 66%, #05060a 100%);
    cursor: grab;
  }
  body:active { cursor: grabbing; }
  #scene {
    display: block; width: 100vw; height: 100vh;
    touch-action: none; outline: none;
    opacity: 0; transition: opacity 1.8s cubic-bezier(.3,.7,.3,1);
  }
  #scene.ready { opacity: 1; }
</style>
